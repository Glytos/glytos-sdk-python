name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The tag only triggers this workflow; the version comes from
      # pyproject.toml. Forgetting to bump it builds a version PyPI already has,
      # which fails late and confusingly. Fail here instead.
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ "$actual" != "$expected" ]; then
            echo "::error file=pyproject.toml::version is $actual but the tag is $expected"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      # Trusted Publishing: authenticates to PyPI with the workflow's OIDC token, so
      # no API token is ever stored. Configure a matching trusted publisher on PyPI.
      - name: Publish to PyPI
        # v1.14.2 is the first release carrying Twine 7, which accepts core
        # metadata 2.5. Hatchling emits 2.5 now, so the previous pin rejected
        # our own wheel at upload time with "not a valid metadata version".
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
